<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>@guru.mounesh • Resource Links</title>
    <!-- Inter Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif']
                    }
                }
            }
        };
    </script>
</head>
<body class="bg-slate-50 text-slate-900 font-sans antialiased min-h-screen flex flex-col">

    <!-- Main Container -->
    <div class="w-full max-w-xl mx-auto px-4 sm:px-6 py-8 sm:py-12 flex-grow">

        <!-- Top Header -->
        <header class="flex items-center justify-between gap-4 pb-6 border-b border-slate-200">
            <div>
                <h1 class="text-xl sm:text-2xl font-extrabold tracking-tight text-slate-900">@guru.mounesh</h1>
                <p class="text-xs sm:text-sm text-slate-500 mt-0.5">Shared resource links</p>
            </div>
            <button id="navToggleBtn" type="button" onclick="toggleView()"
                    class="px-4 py-2 rounded-xl text-xs sm:text-sm font-semibold bg-white text-slate-800 border border-slate-300 hover:bg-slate-100 active:scale-95 transition">
                Admin
            </button>
        </header>

        <!-- Toast Notification (replaces alert/confirm) -->
        <div id="statusToast"
             class="hidden mt-4 px-4 py-2.5 rounded-xl text-xs sm:text-sm font-medium bg-slate-900 text-white shadow-sm">
        </div>

        <!-- ==================== HOME VIEW ==================== -->
        <main id="homeView" class="mt-6">
            <div id="homeLinksList" class="space-y-3"></div>

            <div id="homeEmptyState" class="hidden text-center py-12 px-4 bg-white rounded-2xl border border-slate-200">
                <p class="text-sm font-semibold text-slate-700">No links available right now.</p>
                <p class="text-xs text-slate-500 mt-1">New resource links will appear here soon.</p>
            </div>
        </main>

        <!-- ==================== ADMIN VIEW ==================== -->
        <section id="adminView" class="hidden mt-6">

            <!-- Login Card -->
            <div id="adminLoginBox" class="bg-white rounded-2xl border border-slate-200 p-5 sm:p-6 shadow-2xs">
                <h2 class="text-lg font-bold text-slate-900">Admin Login</h2>
                <p class="text-xs sm:text-sm text-slate-500 mt-1">Sign in to add or delete resource links.</p>

                <form id="loginForm" onsubmit="handleLogin(event)" class="mt-5 space-y-4">
                    <div>
                        <label for="usernameInput" class="block text-xs font-semibold text-slate-700 mb-1.5">Username</label>
                        <input id="usernameInput" type="text" required autocomplete="username" placeholder="Enter username"
                               class="w-full px-3.5 py-2.5 rounded-xl border border-slate-300 text-sm text-slate-900 focus:outline-none focus:border-slate-900">
                    </div>

                    <div>
                        <label for="passwordInput" class="block text-xs font-semibold text-slate-700 mb-1.5">Password</label>
                        <input id="passwordInput" type="password" required autocomplete="current-password" placeholder="Enter password"
                               class="w-full px-3.5 py-2.5 rounded-xl border border-slate-300 text-sm text-slate-900 focus:outline-none focus:border-slate-900">
                    </div>

                    <p id="loginError" class="hidden text-xs font-medium text-red-600 bg-red-50 border border-red-200 rounded-xl px-3.5 py-2.5"></p>

                    <button type="submit"
                            class="w-full py-2.5 px-4 rounded-xl bg-slate-900 hover:bg-slate-800 text-white text-sm font-semibold active:scale-[0.99] transition">
                        Login
                    </button>
                </form>
            </div>

            <!-- Authenticated Link Manager -->
            <div id="adminPanelBox" class="hidden space-y-6">
                <div class="flex items-center justify-between gap-3 bg-white rounded-2xl border border-slate-200 p-4 sm:p-5">
                    <div>
                        <h2 class="text-base sm:text-lg font-bold text-slate-900">Manage Links</h2>
                        <p class="text-xs text-slate-500">Saved locally in this browser</p>
                    </div>
                    <button type="button" onclick="handleLogout()"
                            class="px-3.5 py-2 rounded-xl text-xs sm:text-sm font-semibold bg-slate-100 hover:bg-slate-200 text-slate-800 active:scale-95 transition">
                        Logout
                    </button>
                </div>

                <!-- Add Link Form -->
                <form id="addLinkForm" onsubmit="handleAddLink(event)" class="bg-white rounded-2xl border border-slate-200 p-5 sm:p-6 space-y-4">
                    <h3 class="text-sm font-bold text-slate-900">Add New Link</h3>

                    <div>
                        <label for="linkTitleInput" class="block text-xs font-semibold text-slate-700 mb-1.5">Title</label>
                        <input id="linkTitleInput" type="text" required placeholder="e.g. Useful Guide or Video Link"
                               class="w-full px-3.5 py-2.5 rounded-xl border border-slate-300 text-sm text-slate-900 focus:outline-none focus:border-slate-900">
                    </div>

                    <div>
                        <label for="linkUrlInput" class="block text-xs font-semibold text-slate-700 mb-1.5">URL</label>
                        <input id="linkUrlInput" type="text" required placeholder="example.com or https://example.com"
                               class="w-full px-3.5 py-2.5 rounded-xl border border-slate-300 text-sm text-slate-900 focus:outline-none focus:border-slate-900">
                    </div>

                    <button type="submit"
                            class="w-full py-2.5 px-4 rounded-xl bg-slate-900 hover:bg-slate-800 text-white text-sm font-semibold active:scale-[0.99] transition">
                        Add Link
                    </button>
                </form>

                <!-- Existing Links with Delete -->
                <div class="bg-white rounded-2xl border border-slate-200 p-5 sm:p-6">
                    <h3 class="text-sm font-bold text-slate-900 mb-3">Saved Links</h3>
                    <div id="adminLinksList" class="space-y-2.5"></div>
                    <p id="adminEmptyState" class="hidden text-xs text-slate-500 text-center py-6">No saved links yet.</p>
                </div>
            </div>
        </section>

    </div>

    <script>
        // Storage keys for links and initialization flag
        const LINKS_STORAGE_KEY = 'guru_mounesh_links_v1';
        const INITIALIZED_STORAGE_KEY = 'guru_mounesh_links_initialized_v1';

        // Default sample links used only when localStorage has never been initialized
        const DEFAULT_LINKS = [
            {
                id: 'sample-1',
                title: 'Starter Resource Sheet',
                url: 'https://example.com/resources'
            },
            {
                id: 'sample-2',
                title: 'Quick Reference Guide',
                url: 'https://example.com/guide'
            }
        ];

        // App state
        let links = [];
        let isLoggedIn = false;
        let currentView = 'home'; // 'home' or 'admin'
        let toastTimer = null;

        /**
         * Load links from localStorage, seeding sample links only on first-ever visit.
         */
        function loadLinks() {
            try {
                const alreadyInitialized = localStorage.getItem(INITIALIZED_STORAGE_KEY);
                const raw = localStorage.getItem(LINKS_STORAGE_KEY);

                if (raw !== null) {
                    const parsed = JSON.parse(raw);
                    if (Array.isArray(parsed)) {
                        return parsed;
                    }
                }

                if (!alreadyInitialized) {
                    localStorage.setItem(INITIALIZED_STORAGE_KEY, 'true');
                    localStorage.setItem(LINKS_STORAGE_KEY, JSON.stringify(DEFAULT_LINKS));
                    return [...DEFAULT_LINKS];
                }

                return [];
            } catch (err) {
                console.error('Failed to read links from localStorage:', err);
                return [...DEFAULT_LINKS];
            }
        }

        /**
         * Persist current links array to localStorage.
         */
        function saveLinks() {
            try {
                localStorage.setItem(INITIALIZED_STORAGE_KEY, 'true');
                localStorage.setItem(LINKS_STORAGE_KEY, JSON.stringify(links));
            } catch (err) {
                console.error('Failed to save links to localStorage:', err);
                showToast('Could not save changes in browser storage.');
            }
        }

        /**
         * Normalize user-entered URL so bare domains like example.com get https://
         */
        function normalizeUrl(rawUrl) {
            const trimmed = String(rawUrl || '').trim();
            if (!trimmed) return '';
            if (/^https?:\/\//i.test(trimmed)) {
                return trimmed;
            }
            return 'https://' + trimmed;
        }

        /**
         * Show a short non-blocking status message.
         */
        function showToast(message) {
            const toast = document.getElementById('statusToast');
            if (!toast) return;
            toast.textContent = message;
            toast.classList.remove('hidden');

            if (toastTimer) {
                clearTimeout(toastTimer);
            }
            toastTimer = setTimeout(() => {
                toast.classList.add('hidden');
            }, 2200);
        }

        /**
         * Escape HTML text nodes safely.
         */
        function escapeHtml(value) {
            return String(value ?? '')
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#39;');
        }

        /**
         * Switch between Home and Admin views.
         */
        function setView(viewName) {
            currentView = viewName === 'admin' ? 'admin' : 'home';
            const homeView = document.getElementById('homeView');
            const adminView = document.getElementById('adminView');
            const navBtn = document.getElementById('navToggleBtn');

            if (currentView === 'admin') {
                homeView.classList.add('hidden');
                adminView.classList.remove('hidden');
                navBtn.textContent = 'Home';
                syncAdminVisibility();
            } else {
                adminView.classList.add('hidden');
                homeView.classList.remove('hidden');
                navBtn.textContent = 'Admin';
                renderHomeLinks();
            }
        }

        function toggleView() {
            setView(currentView === 'home' ? 'admin' : 'home');
        }

        /**
         * Show either login form or admin link manager based on login state.
         */
        function syncAdminVisibility() {
            const loginBox = document.getElementById('adminLoginBox');
            const panelBox = document.getElementById('adminPanelBox');

            if (isLoggedIn) {
                loginBox.classList.add('hidden');
                panelBox.classList.remove('hidden');
                renderAdminLinks();
            } else {
                panelBox.classList.add('hidden');
                loginBox.classList.remove('hidden');
            }
        }

        /**
         * Validate admin credentials (username trimmed & case-insensitive, password exact trimmed).
         */
        function handleLogin(event) {
            event.preventDefault();

            const usernameInput = document.getElementById('usernameInput');
            const passwordInput = document.getElementById('passwordInput');
            const errorEl = document.getElementById('loginError');

            const username = (usernameInput.value || '').trim().toLowerCase();
            const password = (passwordInput.value || '').trim();

            if (username === 'luffy' && password === 'mouneshgouda123') {
                errorEl.classList.add('hidden');
                errorEl.textContent = '';
                isLoggedIn = true;
                usernameInput.value = '';
                passwordInput.value = '';
                syncAdminVisibility();
                showToast('Logged in to Admin.');
            } else {
                errorEl.textContent = 'Invalid username or password. Please try again.';
                errorEl.classList.remove('hidden');
            }
        }

        /**
         * Log out of admin view.
         */
        function handleLogout() {
            isLoggedIn = false;
            syncAdminVisibility();
            showToast('Logged out.');
        }

        /**
         * Add a new link from Admin form.
         */
        function handleAddLink(event) {
            event.preventDefault();
            if (!isLoggedIn) return;

            const titleInput = document.getElementById('linkTitleInput');
            const urlInput = document.getElementById('linkUrlInput');

            const title = (titleInput.value || '').trim();
            const url = normalizeUrl(urlInput.value);

            if (!title || !url) {
                showToast('Please enter both a title and a URL.');
                return;
            }

            const newItem = {
                id: 'link-' + Date.now() + '-' + Math.random().toString(36).slice(2, 7),
                title,
                url
            };

            links.unshift(newItem);
            saveLinks();

            titleInput.value = '';
            urlInput.value = '';

            renderAdminLinks();
            renderHomeLinks();
            showToast('Link added.');
        }

        /**
         * Delete a link by id.
         */
        function handleDeleteLink(linkId) {
            if (!isLoggedIn || !linkId) return;

            links = links.filter((item) => item.id !== linkId);
            saveLinks();
            renderAdminLinks();
            renderHomeLinks();
            showToast('Link deleted.');
        }

        /**
         * Copy a URL using document.execCommand('copy') for broad compatibility.
         */
        function copyLinkUrl(url) {
            const tempInput = document.createElement('textarea');
            tempInput.value = url;
            tempInput.setAttribute('readonly', '');
            tempInput.style.position = 'fixed';
            tempInput.style.left = '-9999px';
            document.body.appendChild(tempInput);
            tempInput.select();

            let copied = false;
            try {
                copied = document.execCommand('copy');
            } catch (err) {
                copied = false;
            }

            document.body.removeChild(tempInput);
            showToast(copied ? 'Link copied to clipboard.' : 'Could not copy link.');
        }

        /**
         * Render public links on Home view.
         */
        function renderHomeLinks() {
            const listEl = document.getElementById('homeLinksList');
            const emptyEl = document.getElementById('homeEmptyState');

            if (!links.length) {
                listEl.innerHTML = '';
                emptyEl.classList.remove('hidden');
                return;
            }

            emptyEl.classList.add('hidden');
            listEl.innerHTML = links.map((item) => {
                const safeTitle = escapeHtml(item.title);
                const safeUrl = escapeHtml(item.url);
                const encodedUrlForJs = encodeURIComponent(item.url);

                return `
                    <article class="bg-white rounded-2xl border border-slate-200 p-4 sm:p-5 flex items-center justify-between gap-4 hover:border-slate-300 transition">
                        <div class="min-w-0 flex-1">
                            <h2 class="text-sm sm:text-base font-bold text-slate-900 break-words">${safeTitle}</h2>
                            <a href="${safeUrl}" target="_blank" rel="noopener noreferrer"
                               class="inline-block text-xs sm:text-sm text-blue-600 hover:underline break-all mt-1">
                                ${safeUrl}
                            </a>
                        </div>
                        <button type="button" onclick="copyLinkUrl(decodeURIComponent('${encodedUrlForJs}'))"
                                class="shrink-0 px-3.5 py-2 rounded-xl text-xs font-semibold bg-slate-100 hover:bg-slate-200 text-slate-800 active:scale-95 transition">
                            Copy
                        </button>
                    </article>
                `;
            }).join('');
        }

        /**
         * Render links inside Admin view with Delete buttons.
         */
        function renderAdminLinks() {
            const listEl = document.getElementById('adminLinksList');
            const emptyEl = document.getElementById('adminEmptyState');

            if (!links.length) {
                listEl.innerHTML = '';
                emptyEl.classList.remove('hidden');
                return;
            }

            emptyEl.classList.add('hidden');
            listEl.innerHTML = links.map((item) => {
                const safeTitle = escapeHtml(item.title);
                const safeUrl = escapeHtml(item.url);
                const encodedIdForJs = encodeURIComponent(item.id);

                return `
                    <div class="flex items-center justify-between gap-3 p-3.5 rounded-xl bg-slate-50 border border-slate-200">
                        <div class="min-w-0 flex-1">
                            <p class="text-sm font-semibold text-slate-900 truncate">${safeTitle}</p>
                            <p class="text-xs text-slate-500 truncate mt-0.5">${safeUrl}</p>
                        </div>
                        <button type="button" onclick="handleDeleteLink(decodeURIComponent('${encodedIdForJs}'))"
                                class="shrink-0 px-3 py-1.5 rounded-xl text-xs font-semibold bg-red-50 hover:bg-red-100 text-red-700 border border-red-200 active:scale-95 transition">
                            Delete
                        </button>
                    </div>
                `;
            }).join('');
        }

        // Initialize app on load
        document.addEventListener('DOMContentLoaded', () => {
            links = loadLinks();
            renderHomeLinks();
            setView('home');
        });
    </script>
</body>
</html>
